[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweden-vfs-appointment-monitor"
version = "0.1.0"
description = "Python monitor for Sweden Schengen visa appointment availability through VFS Global Pakistan, with Telegram and email alerts."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]
browser = [
  "playwright>=1.54,<2",
]

[project.scripts]
vfs-monitor = "vfs_monitor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

